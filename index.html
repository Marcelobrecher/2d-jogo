<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Plataforma</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d111a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            /* Fundo com a grade igual à da imagem */
            background-color: #111625;
            background-image: 
                linear-gradient(#1c2333 1px, transparent 1px),
                linear-gradient(90deg, #1c2333 1px, transparent 1px);
            background-size: 40px 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Configurações do Jogador
        const player = {
            x: 80, 
            y: 300, 
            width: 30, 
            height: 30,
            dx: 0, 
            dy: 0, 
            speed: 5, 
            jumpPower: -11.5, // Poder de pulo ajustado para alcançar a plataforma
            grounded: false
        };

        // Plataformas da fase
        const platforms = [
            { x: 0, y: 360, w: 420, h: 40 },   // Chão da esquerda
            { x: 550, y: 220, w: 250, h: 20 }  // Plataforma flutuante (altura ajustada para pulo possível)
        ];

        // Obstáculos (Caixa com X)
        const obstacles = [
            { x: 220, y: 330, w: 30, h: 30 } // Espaçamento ajustado
        ];

        // Objetivo (Moeda amarela)
        const goal = { x: 680, y: 180, radius: 12 };

        // Controles
        const keys = { right: false, left: false, up: false };

        window.addEventListener("keydown", e => {
            if (e.key === "ArrowRight") keys.right = true;
            if (e.key === "ArrowLeft") keys.left = true;
            if (e.key === "ArrowUp" || e.key === " ") {
                if (player.grounded) {
                    player.dy = player.jumpPower;
                    player.grounded = false;
                }
            }
        });

        window.addEventListener("keyup", e => {
            if (e.key === "ArrowRight") keys.right = false;
            if (e.key === "ArrowLeft") keys.left = false;
        });

        function update() {
            // Movimentação horizontal
            if (keys.right) player.dx = player.speed;
            else if (keys.left) player.dx = -player.speed;
            else player.dx = 0;

            // Gravidade e movimentação vertical
            player.dy += 0.5; // Gravidade suavizada para um pulo mais agradável
            player.x += player.dx;
            player.y += player.dy;
            player.grounded = false;

            // Limites da tela (paredes)
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Colisão com as plataformas
            platforms.forEach(p => {
                if (player.x < p.x + p.w && player.x + player.width > p.x &&
                    player.y < p.y + p.h && player.y + player.height > p.y) {
                    
                    // Colisão por cima (aterrissar)
                    if (player.dy > 0 && player.y + player.height - player.dy <= p.y + 1) {
                        player.y = p.y - player.height;
                        player.dy = 0;
                        player.grounded = true;
                    }
                }
            });

            // Colisão com obstáculo vermelho (Reinicia o jogador)
            obstacles.forEach(o => {
                if (player.x < o.x + o.w && player.x + player.width > o.x &&
                    player.y < o.y + o.h && player.y + player.height > o.y) {
                    resetGame();
                }
            });

            // Caindo no buraco (Reinicia o jogador)
            if (player.y > canvas.height) {
                resetGame();
            }
        }

        function resetGame() {
            player.x = 80;
            player.y = 300;
            player.dy = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar plataformas (com borda ciano no topo)
            platforms.forEach(p => {
                ctx.fillStyle = "#333333";
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = "#00ffcc"; // Borda ciano
                ctx.fillRect(p.x, p.y, p.w, 4);
            });

            // Desenhar obstáculos (Vermelho com um X)
            obstacles.forEach(o => {
                ctx.fillStyle = "#ff2222";
                ctx.fillRect(o.x, o.y, o.w, o.h);
                ctx.strokeStyle = "black";
                ctx.lineWidth = 2;
                ctx.strokeRect(o.x, o.y, o.w, o.h);
                
                // Desenhar o 'X'
                ctx.beginPath();
                ctx.moveTo(o.x, o.y);
                ctx.lineTo(o.x + o.w, o.y + o.h);
                ctx.moveTo(o.x + o.w, o.y);
                ctx.lineTo(o.x, o.y + o.h);
                ctx.stroke();
            });

            // Desenhar Objetivo (Moeda amarela)
            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ffcc00";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();

            // Desenhar Jogador (Cubo Azul)
            ctx.fillStyle = "#0088ff";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = "black";
            ctx.strokeRect(player.x, player.y, player.width, player.height);
            
            // Detalhe do olho/quadrado branco do jogador
            ctx.fillStyle = "white";
            ctx.fillRect(player.x + 18, player.y + 6, 6, 6);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Iniciar o jogo
        loop();
    </script>
</body>
</html>
