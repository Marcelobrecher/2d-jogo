<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Jornada do Byte - V2.0</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            border: 4px solid #4CAF50;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.4);
            border-radius: 10px;
            overflow: hidden;
        }
        #gameCanvas { display: block; }
        
        #hud {
            position: absolute;
            top: 10px; left: 15px; right: 15px;
            display: flex; justify-content: space-between;
            font-size: 18px; font-weight: bold;
            text-shadow: 2px 2px 2px black;
            pointer-events: none;
        }
        .hud-item { color: #00ffcc; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #overlay.hidden { display: none; }
        #overlay h1 { font-size: 40px; margin-bottom: 20px; text-shadow: 0 0 10px currentColor; }
        
        button {
            padding: 12px 25px; font-size: 18px; font-family: 'Courier New', Courier, monospace;
            background-color: #00ffcc; color: #000; font-weight: bold;
            border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 0 10px #00ffcc;
        }
        button:hover { background-color: #00ccaa; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Interface Superior -->
        <div id="hud">
            <span class="hud-item">Fase: <span id="levelDisplay">1</span>/5</span>
            <span class="hud-item">Dados: <span id="coinsDisplay">0/0</span></span>
            <span class="hud-item">Vidas: <span id="livesDisplay">3</span></span>
            <span class="hud-item" style="color: gold;">Score: <span id="scoreDisplay">0</span></span>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- Telas de Mensagem -->
        <div id="overlay" class="hidden">
            <h1 id="overlayMessage">Sistema Restaurado!</h1>
            <button id="restartBtn">Reiniciar Jogo</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Elementos UI
        const scoreDisplay = document.getElementById("scoreDisplay");
        const livesDisplay = document.getElementById("livesDisplay");
        const levelDisplay = document.getElementById("levelDisplay");
        const coinsDisplay = document.getElementById("coinsDisplay");
        const overlay = document.getElementById("overlay");
        const overlayMessage = document.getElementById("overlayMessage");
        const restartBtn = document.getElementById("restartBtn");

        // Status Geral
        let score = 0;
        let lives = 3;
        let currentLevel = 0; // Vai de 0 a 4 (Fases 1 a 5)
        let gameOver = false;
        let gameWon = false;
        let animationId;
        let time = 0; // Usado para animações (pulsar)

        // Jogador
        const player = {
            x: 0, y: 0, w: 20, h: 20,
            speed: 5, vx: 0, vy: 0,
            jumpPower: -10, gravity: 0.5, grounded: false,
            facingRight: true // Para desenhar o olhinho
        };

        const keys = { right: false, left: false, up: false };

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") { keys.right = true; player.facingRight = true; }
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") { keys.left = true; player.facingRight = false; }
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") keys.up = true;
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = false;
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = false;
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") keys.up = false;
        });

        // Configuração das 5 Fases
        const levelData = [
            { // FASE 1: Aprender a pular
                start: { x: 50, y: 300 }, goal: { x: 700, y: 330, w: 40, h: 50 },
                platforms: [ { x: 0, y: 380, w: 800, h: 20 }, { x: 200, y: 310, w: 100, h: 10 }, { x: 400, y: 240, w: 100, h: 10 } ],
                coins: [ { x: 240, y: 280, w: 15, h: 15 }, { x: 440, y: 210, w: 15, h: 15 } ],
                enemies: []
            },
            { // FASE 2: Buracos e primeiros bugs
                start: { x: 20, y: 300 }, goal: { x: 720, y: 150, w: 40, h: 50 },
                platforms: [ { x: 0, y: 380, w: 200, h: 20 }, { x: 300, y: 380, w: 200, h: 20 }, { x: 550, y: 280, w: 100, h: 10 }, { x: 680, y: 200, w: 120, h: 10 } ],
                coins: [ { x: 150, y: 350, w: 15, h: 15 }, { x: 350, y: 350, w: 15, h: 15 }, { x: 600, y: 250, w: 15, h: 15 } ],
                enemies: [ { x: 400, y: 360, w: 20, h: 20 } ]
            },
            { // FASE 3: Zigue-zague
                start: { x: 20, y: 100 }, goal: { x: 20, y: 330, w: 40, h: 50 },
                platforms: [ { x: 0, y: 150, w: 150, h: 10 }, { x: 250, y: 200, w: 100, h: 10 }, { x: 500, y: 250, w: 100, h: 10 }, { x: 200, y: 320, w: 100, h: 10 }, { x: 0, y: 380, w: 150, h: 20 } ],
                coins: [ { x: 290, y: 170, w: 15, h: 15 }, { x: 540, y: 220, w: 15, h: 15 }, { x: 240, y: 290, w: 15, h: 15 } ],
                enemies: [ { x: 50, y: 130, w: 20, h: 20 } ]
            },
            { // FASE 4: Chão minado
                start: { x: 20, y: 300 }, goal: { x: 740, y: 50, w: 40, h: 50 },
                platforms: [ { x: 0, y: 380, w: 100, h: 20 }, { x: 150, y: 300, w: 50, h: 10 }, { x: 250, y: 230, w: 50, h: 10 }, { x: 400, y: 180, w: 100, h: 10 }, { x: 550, y: 120, w: 50, h: 10 }, { x: 680, y: 100, w: 120, h: 10 } ],
                coins: [ { x: 165, y: 270, w: 15, h: 15 }, { x: 265, y: 200, w: 15, h: 15 }, { x: 440, y: 150, w: 15, h: 15 } ],
                enemies: [ { x: 100, y: 380, w: 800, h: 20 } ] // Chão inteiro de lava/bug
            },
            { // FASE 5: O Núcleo do Sistema
                start: { x: 20, y: 300 }, goal: { x: 380, y: 60, w: 40, h: 50 },
                platforms: [ { x: 0, y: 380, w: 100, h: 20 }, { x: 150, y: 320, w: 60, h: 10 }, { x: 300, y: 320, w: 60, h: 10 }, { x: 450, y: 320, w: 60, h: 10 }, { x: 600, y: 320, w: 60, h: 10 }, { x: 700, y: 220, w: 80, h: 10 }, { x: 500, y: 150, w: 80, h: 10 }, { x: 350, y: 110, w: 100, h: 10 } ],
                coins: [ { x: 170, y: 290, w: 15, h: 15 }, { x: 320, y: 290, w: 15, h: 15 }, { x: 470, y: 290, w: 15, h: 15 }, { x: 620, y: 290, w: 15, h: 15 }, { x: 730, y: 190, w: 15, h: 15 } ],
                enemies: [ { x: 100, y: 380, w: 700, h: 20 }, { x: 530, y: 130, w: 20, h: 20 } ]
            }
        ];

        let platforms, coins, enemies, goal, coinsTotal, coinsCollected;

        function loadLevel() {
            let data = levelData[currentLevel];
            player.x = data.start.x; player.y = data.start.y;
            player.vx = 0; player.vy = 0;
            
            // Clonando os dados para não alterar o original
            platforms = JSON.parse(JSON.stringify(data.platforms));
            coins = JSON.parse(JSON.stringify(data.coins)).map(c => ({...c, collected: false}));
            enemies = JSON.parse(JSON.stringify(data.enemies));
            goal = data.goal;
            
            coinsTotal = coins.length;
            coinsCollected = 0;
            
            levelDisplay.innerText = currentLevel + 1;
            updateHUD();
        }

        function checkCollision(r1, r2) {
            return (r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y);
        }

        function updateHUD() {
            scoreDisplay.innerText = score;
            livesDisplay.innerText = lives;
            coinsDisplay.innerText = `${coinsCollected}/${coinsTotal}`;
        }

        function update() {
            if (gameOver || gameWon) return;
            time += 0.1;

            if (keys.right) player.vx = player.speed;
            else if (keys.left) player.vx = -player.speed;
            else player.vx = 0; 

            if (keys.up && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            player.grounded = false;
            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vy > 0 && player.y + player.h - player.vy <= p.y) {
                        player.grounded = true; player.vy = 0; player.y = p.y - player.h;
                    }
                }
            }

            for (let c of coins) {
                if (!c.collected && checkCollision(player, c)) {
                    c.collected = true; coinsCollected++; score += 50; updateHUD();
                }
            }

            for (let e of enemies) if (checkCollision(player, e)) loseLife();
            if (player.y > canvas.height) loseLife();

            // Colisão com Portal
            if (checkCollision(player, goal)) {
                if (coinsCollected === coinsTotal) {
                    if (currentLevel < levelData.length - 1) {
                        currentLevel++; loadLevel(); score += 200;
                    } else {
                        gameWon = true; showOverlay("SISTEMA RESTAURADO!\nVocê salvou o PC!", "#00ffcc");
                    }
                }
            }
        }

        function loseLife() {
            lives--; updateHUD();
            if (lives <= 0) {
                gameOver = true; showOverlay("SISTEMA CORROMPIDO", "#ff3333");
            } else {
                loadLevel(); // Reinicia a fase atual
            }
        }

        function showOverlay(msg, color) {
            overlayMessage.innerText = msg;
            overlayMessage.style.color = color;
            overlay.classList.remove("hidden");
        }

        function draw() {
            // Fundo escuro
            ctx.fillStyle = "#111122";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grade Cyberpunk ao fundo
            ctx.strokeStyle = "rgba(0, 255, 204, 0.05)";
            for(let i=0; i<800; i+=40) {
                ctx.strokeRect(i, 0, 1, 400); ctx.strokeRect(0, i, 800, 1);
            }

            // Portal
            let isPortalOpen = (coinsCollected === coinsTotal);
            ctx.fillStyle = isPortalOpen ? "#00ffcc" : "#662222";
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            // Brilho do portal
            if(isPortalOpen) {
                ctx.strokeStyle = "white"; ctx.lineWidth = 2;
                ctx.strokeRect(goal.x + Math.sin(time)*5, goal.y, goal.w, goal.h);
            }

            // Plataformas
            for (let p of platforms) {
                ctx.fillStyle = "#333"; ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = "#00ffcc"; ctx.fillRect(p.x, p.y, p.w, 3); // Borda neon cima
            }

            // Moedas (Pulsando)
            for (let c of coins) {
                if (!c.collected) {
                    let pulse = Math.abs(Math.sin(time)) * 3;
                    ctx.fillStyle = "gold";
                    ctx.beginPath();
                    ctx.arc(c.x + c.w/2, c.y + c.h/2, (c.w/2) + pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(c.x + c.w/2, c.y + c.h/2, c.w/4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Bugs (Inimigos)
            ctx.fillStyle = "#ff3333";
            for (let e of enemies) {
                ctx.fillRect(e.x, e.y, e.w, e.h);
                // Desenha um "X" preto
                ctx.strokeStyle = "black"; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.w, e.y + e.h);
                ctx.moveTo(e.x + e.w, e.y); ctx.lineTo(e.x, e.y + e.h);
                ctx.stroke();
            }

            // Jogador (Byte)
            ctx.fillStyle = "#0088ff";
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = "cyan"; // Borda neon
            ctx.strokeRect(player.x, player.y, player.w, player.h);
            
            // "Olhinho" do jogador
            ctx.fillStyle = "white";
            let eyeX = player.facingRight ? player.x + 12 : player.x + 2;
            ctx.fillRect(eyeX, player.y + 4, 6, 6);
        }

        function gameLoop() {
            update();
            draw();
            if (!gameOver && !gameWon) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        restartBtn.addEventListener("click", () => {
            score = 0; lives = 3; currentLevel = 0;
            gameOver = false; gameWon = false;
            overlay.classList.add("hidden");
            loadLevel();
            cancelAnimationFrame(animationId);
            gameLoop();
        });

        // Start
        loadLevel();
        gameLoop();
    </script>
</body>
</html>
