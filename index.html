<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Jornada do Byte - V3.0</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            border: 4px solid #4CAF50;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.4);
            border-radius: 10px;
            overflow: hidden;
        }
        #gameCanvas { display: block; }
        
        #hud {
            position: absolute;
            top: 10px; left: 15px; right: 15px;
            display: flex; justify-content: space-between;
            font-size: 16px; font-weight: bold;
            text-shadow: 2px 2px 2px black;
            pointer-events: none;
        }
        .hud-item { color: #00ffcc; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.88);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
            padding: 20px;
        }
        #overlay.hidden { display: none; }
        #overlay h1 { font-size: 32px; margin-bottom: 14px; text-shadow: 0 0 10px currentColor; }
        #overlay p { font-size: 16px; color: #d8f3dc; max-width: 560px; line-height: 1.5; margin-bottom: 24px; }
        
        button {
            padding: 12px 25px; font-size: 18px; font-family: 'Courier New', Courier, monospace;
            background-color: #00ffcc; color: #000; font-weight: bold;
            border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 0 10px #00ffcc;
        }
        button:hover { background-color: #00ccaa; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Interface Superior -->
        <div id="hud">
            <span class="hud-item">Fase: <span id="levelDisplay">1/6</span></span>
            <span class="hud-item" style="color: #ff9e00;">Cenouras: <span id="coinsDisplay">0/0</span></span>
            <span class="hud-item">Vidas: <span id="livesDisplay">3</span></span>
            <span class="hud-item" style="color: gold;">Score: <span id="scoreDisplay">0</span></span>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- Telas de Mensagem -->
        <div id="overlay" class="hidden">
            <h1 id="overlayMessage">Sistema Restaurado!</h1>
            <p id="overlaySubMessage"></p>
            <button id="restartBtn">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Elementos UI
        const scoreDisplay = document.getElementById("scoreDisplay");
        const livesDisplay = document.getElementById("livesDisplay");
        const levelDisplay = document.getElementById("levelDisplay");
        const coinsDisplay = document.getElementById("coinsDisplay");
        const overlay = document.getElementById("overlay");
        const overlayMessage = document.getElementById("overlayMessage");
        const overlaySubMessage = document.getElementById("overlaySubMessage");
        const restartBtn = document.getElementById("restartBtn");

        // Status Geral
        let score = 0;
        let lives = 3;
        let currentLevel = 0; // Vai de 0 a 5 (Fases 1 a 6)
        let gameOver = false;
        let gameWon = false;
        let animationId;
        let time = 0;

        // Partículas do Cenário
        const bgParticles = Array.from({ length: 45 }, () => ({
            x: Math.random() * 800,
            y: Math.random() * 400,
            size: Math.random() * 3 + 1,
            speed: Math.random() * 1.2 + 0.4,
            alpha: Math.random() * 0.6 + 0.2
        }));

        // Torres de fundo
        const bgTowers = [
            { x: 30, w: 70, h: 210 },
            { x: 130, w: 50, h: 150 },
            { x: 220, w: 90, h: 260 },
            { x: 360, w: 60, h: 180 },
            { x: 470, w: 100, h: 240 },
            { x: 610, w: 55, h: 160 },
            { x: 700, w: 80, h: 230 }
        ];

        // Jogador
        const player = {
            x: 0, y: 0, w: 20, h: 20,
            speed: 5, vx: 0, vy: 0,
            jumpPower: -10, gravity: 0.5, grounded: false,
            facingRight: true,
            standingOn: null
        };

        const keys = { right: false, left: false, up: false };

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") { keys.right = true; player.facingRight = true; }
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") { keys.left = true; player.facingRight = false; }
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") keys.up = true;
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = false;
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = false;
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") keys.up = false;
        });

        // Configuração das 6 Fases
        const levelData = [
            { // FASE 1
                name: "Setor Inicial",
                start: { x: 50, y: 300 }, goal: { x: 700, y: 330, w: 40, h: 50 },
                platforms: [ { x: 0, y: 380, w: 800, h: 20 }, { x: 200, y: 310, w: 100, h: 10 }, { x: 400, y: 240, w: 100, h: 10 } ],
                coins: [ { x: 242, y: 282, w: 16, h: 16 }, { x: 442, y: 212, w: 16, h: 16 } ],
                enemies: []
            },
            { // FASE 2
                name: "Ponte de Dados",
                start: { x: 20, y: 300 }, goal: { x: 720, y: 150, w: 40, h: 50 },
                platforms: [ { x: 0, y: 380, w: 200, h: 20 }, { x: 300, y: 380, w: 200, h: 20 }, { x: 550, y: 290, w: 100, h: 10 }, { x: 680, y: 200, w: 120, h: 10 } ],
                coins: [ { x: 150, y: 352, w: 16, h: 16 }, { x: 350, y: 352, w: 16, h: 16 }, { x: 600, y: 252, w: 16, h: 16 } ],
                enemies: [ { x: 400, y: 360, w: 20, h: 20 } ]
            },
            { // FASE 3
                name: "Torre de Memória",
                start: { x: 20, y: 100 }, goal: { x: 20, y: 330, w: 40, h: 50 },
                platforms: [ { x: 0, y: 150, w: 150, h: 10 }, { x: 250, y: 200, w: 100, h: 10 }, { x: 500, y: 250, w: 100, h: 10 }, { x: 200, y: 320, w: 100, h: 10 }, { x: 0, y: 380, w: 150, h: 20 } ],
                coins: [ { x: 292, y: 172, w: 16, h: 16 }, { x: 542, y: 222, w: 16, h: 16 }, { x: 242, y: 292, w: 16, h: 16 } ],
                enemies: [ { x: 50, y: 130, w: 20, h: 20 } ]
            },
            { // FASE 4: Lava
                name: "Núcleo Aquecido",
                start: { x: 20, y: 300 }, goal: { x: 740, y: 50, w: 40, h: 50 },
                platforms: [ { x: 0, y: 380, w: 100, h: 20 }, { x: 150, y: 300, w: 50, h: 10 }, { x: 250, y: 230, w: 50, h: 10 }, { x: 400, y: 180, w: 100, h: 10 }, { x: 550, y: 120, w: 50, h: 10 }, { x: 680, y: 100, w: 120, h: 10 } ],
                coins: [ { x: 166, y: 272, w: 16, h: 16 }, { x: 266, y: 202, w: 16, h: 16 }, { x: 442, y: 152, w: 16, h: 16 } ],
                enemies: [ { x: 100, y: 380, w: 800, h: 20 } ]
            },
            { // FASE 5: Lava
                name: "Caldeira Central",
                start: { x: 20, y: 300 }, goal: { x: 380, y: 60, w: 40, h: 50 },
                platforms: [ { x: 0, y: 380, w: 100, h: 20 }, { x: 150, y: 320, w: 60, h: 10 }, { x: 300, y: 320, w: 60, h: 10 }, { x: 450, y: 320, w: 60, h: 10 }, { x: 600, y: 320, w: 60, h: 10 }, { x: 700, y: 240, w: 80, h: 10 }, { x: 500, y: 165, w: 80, h: 10 }, { x: 350, y: 110, w: 100, h: 10 } ],
                coins: [ { x: 172, y: 292, w: 16, h: 16 }, { x: 322, y: 292, w: 16, h: 16 }, { x: 472, y: 292, w: 16, h: 16 }, { x: 622, y: 292, w: 16, h: 16 }, { x: 732, y: 212, w: 16, h: 16 } ],
                enemies: [ { x: 100, y: 380, w: 700, h: 20 }, { x: 530, y: 145, w: 20, h: 20 } ]
            },
            { // FASE 6: O Jardim da Cenoura Matriz (Fase Final Criativa)
                name: "Jardim da Cenoura Matriz",
                start: { x: 45, y: 325 }, goal: { x: 265, y: 37, w: 46, h: 55 },
                platforms: [
                    { x: 20, y: 360, w: 90, h: 20 }, // Ilha inicial
                    { x: 150, y: 310, w: 75, h: 10, moveX: 1.4, minX: 130, maxX: 255 }, // Elevador 1
                    { x: 355, y: 265, w: 85, h: 10 }, // Ilha central
                    { x: 490, y: 215, w: 75, h: 10, moveX: -1.5, minX: 475, maxX: 615 }, // Elevador 2
                    { x: 665, y: 165, w: 115, h: 10 }, // Varanda direita com bug patrulhando
                    { x: 520, y: 118, w: 75, h: 10, moveX: 1.3, minX: 495, maxX: 605 }, // Elevador superior
                    { x: 240, y: 92, w: 190, h: 12 } // Altar da Cenoura Matriz
                ],
                coins: [
                    { x: 195, y: 278, w: 16, h: 16 },
                    { x: 390, y: 235, w: 16, h: 16 },
                    { x: 545, y: 183, w: 16, h: 16 },
                    { x: 715, y: 133, w: 16, h: 16 },
                    { x: 552, y: 86, w: 16, h: 16 },
                    { x: 375, y: 62, w: 16, h: 16 }
                ],
                enemies: [
                    { x: 110, y: 385, w: 690, h: 15 }, // Abismo de energia instável
                    { x: 740, y: 145, w: 20, h: 20, moveX: 0.9, minX: 675, maxX: 755 } // Bug guardião
                ]
            }
        ];

        let platforms, coins, enemies, goal, coinsTotal, coinsCollected;

        function loadLevel() {
            let data = levelData[currentLevel];
            player.x = data.start.x; player.y = data.start.y;
            player.vx = 0; player.vy = 0;
            player.standingOn = null;
            
            platforms = JSON.parse(JSON.stringify(data.platforms));
            coins = JSON.parse(JSON.stringify(data.coins)).map(c => ({...c, collected: false}));
            enemies = JSON.parse(JSON.stringify(data.enemies));
            goal = data.goal;
            
            coinsTotal = coins.length;
            coinsCollected = 0;
            
            levelDisplay.innerText = `${currentLevel + 1}/${levelData.length} (${data.name})`;
            updateHUD();
        }

        function checkCollision(r1, r2) {
            return (r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y);
        }

        function updateHUD() {
            scoreDisplay.innerText = score;
            livesDisplay.innerText = lives;
            coinsDisplay.innerText = `${coinsCollected}/${coinsTotal}`;
        }

        function update() {
            if (gameOver || gameWon) return;
            time += 0.1;

            // Atualiza plataformas móveis (Fase 6)
            for (let p of platforms) {
                if (p.moveX) {
                    let prevX = p.x;
                    p.x += p.moveX;
                    if (p.x <= p.minX || p.x >= p.maxX) {
                        p.moveX *= -1;
                    }
                    p.deltaX = p.x - prevX;
                } else {
                    p.deltaX = 0;
                }
            }

            // Atualiza inimigos patrulhando (Fase 6)
            for (let e of enemies) {
                if (e.moveX) {
                    e.x += e.moveX;
                    if (e.x <= e.minX || e.x >= e.maxX) {
                        e.moveX *= -1;
                    }
                }
            }

            // Carrega o jogador junto se estiver em cima de uma plataforma móvel
            if (player.grounded && player.standingOn && player.standingOn.deltaX) {
                player.x += player.standingOn.deltaX;
            }

            if (keys.right) player.vx = player.speed;
            else if (keys.left) player.vx = -player.speed;
            else player.vx = 0; 

            if (keys.up && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
                player.standingOn = null;
            }

            // 1. Movimento horizontal (Eixo X)
            player.x += player.vx;

            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vx > 0) {
                        player.x = p.x - player.w;
                    } else if (player.vx < 0) {
                        player.x = p.x + p.w;
                    } else if (p.deltaX > 0) {
                        player.x = p.x + p.w;
                    } else if (p.deltaX < 0) {
                        player.x = p.x - player.w;
                    }
                }
            }

            // 2. Gravidade e movimento vertical (Eixo Y)
            player.vy += player.gravity;
            player.y += player.vy;
            player.grounded = false;
            player.standingOn = null;

            for (let p of platforms) {
                if (checkCollision(player, p)) {
                    if (player.vy > 0) {
                        player.grounded = true;
                        player.standingOn = p;
                        player.vy = 0;
                        player.y = p.y - player.h;
                    } else if (player.vy < 0) {
                        player.vy = 0;
                        player.y = p.y + p.h;
                    }
                }
            }

            // Coleta das Cenouras
            for (let c of coins) {
                if (!c.collected && checkCollision(player, c)) {
                    c.collected = true; coinsCollected++; score += 50; updateHUD();
                }
            }

            for (let e of enemies) if (checkCollision(player, e)) loseLife();
            if (player.y > canvas.height) loseLife();

            // Colisão com Portal
            if (checkCollision(player, goal)) {
                if (coinsCollected === coinsTotal) {
                    if (currentLevel < levelData.length - 1) {
                        currentLevel++; loadLevel(); score += 200;
                    } else {
                        score += 500;
                        updateHUD();
                        gameWon = true;
                        showOverlay(
                            "JARDIM DO NÚCLEO RESTAURADO!",
                            `Byte recuperou todas as Bio-Cenouras, resfriou o núcleo de lava e devolveu a energia natural ao sistema! Pontuação Final: ${score}`,
                            "#00ffcc"
                        );
                    }
                }
            }
        }

        function loseLife() {
            lives--; updateHUD();
            if (lives <= 0) {
                gameOver = true;
                showOverlay(
                    "SISTEMA CORROMPIDO",
                    "Os bugs consumiram a energia do sistema. Tente novamente para salvar o Jardim do Núcleo!",
                    "#ff3333"
                );
            } else {
                loadLevel();
            }
        }

        function showOverlay(msg, subMsg, color) {
            overlayMessage.innerText = msg;
            overlayMessage.style.color = color;
            overlaySubMessage.innerText = subMsg;
            overlay.classList.remove("hidden");
        }

        function fillRoundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            ctx.fill();
        }

        // Desenha uma Cenoura estilizada (substituindo as orbs)
        function drawCarrot(x, y, scale = 1, angle = -0.35) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.rotate(angle);

            // Folhas verdes no topo
            ctx.fillStyle = "#00e676";
            ctx.beginPath();
            ctx.ellipse(-3, -9, 2.2, 5, -0.4, 0, Math.PI * 2);
            ctx.ellipse(0, -10, 2.2, 5.5, 0, 0, Math.PI * 2);
            ctx.ellipse(3, -9, 2.2, 5, 0.4, 0, Math.PI * 2);
            ctx.fill();

            // Corpo laranja da cenoura
            const carrotGrad = ctx.createLinearGradient(-5, -6, 5, 9);
            carrotGrad.addColorStop(0, "#ffaa00");
            carrotGrad.addColorStop(1, "#ff5400");
            ctx.fillStyle = carrotGrad;
            ctx.beginPath();
            ctx.moveTo(-5.5, -5);
            ctx.quadraticCurveTo(0, -7, 5.5, -5);
            ctx.quadraticCurveTo(4, 3, 0, 10);
            ctx.quadraticCurveTo(-4, 3, -5.5, -5);
            ctx.closePath();
            ctx.fill();

            // Contorno brilhante sutil
            ctx.strokeStyle = "#fff3b0";
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // Detalhes horizontais da cenoura
            ctx.strokeStyle = "#cc3d00";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-3.2, -2); ctx.lineTo(0.5, -2);
            ctx.moveTo(-0.5, 1.5); ctx.lineTo(2.8, 1.5);
            ctx.moveTo(-1.8, 5); ctx.lineTo(0.8, 5);
            ctx.stroke();

            ctx.restore();
        }

        function drawBackground() {
            const isLavaLevel = (currentLevel === 3 || currentLevel === 4);
            const isGardenFinale = (currentLevel === 5);

            // 1. Gradiente principal do céu/sistema
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (isGardenFinale) {
                bgGrad.addColorStop(0, "#041a14");
                bgGrad.addColorStop(0.55, "#0a362a");
                bgGrad.addColorStop(1, "#135c45");
            } else if (isLavaLevel) {
                bgGrad.addColorStop(0, "#140306");
                bgGrad.addColorStop(0.55, "#2d0808");
                bgGrad.addColorStop(1, "#661403");
            } else {
                bgGrad.addColorStop(0, "#070b14");
                bgGrad.addColorStop(0.55, "#0d1629");
                bgGrad.addColorStop(1, "#142642");
            }
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Silhuetas de servidores/estruturas ao fundo
            for (let i = 0; i < bgTowers.length; i++) {
                const t = bgTowers[i];
                const topY = canvas.height - t.h;
                ctx.fillStyle = isGardenFinale
                    ? "rgba(4, 24, 18, 0.75)"
                    : (isLavaLevel ? "rgba(25, 4, 4, 0.75)" : "rgba(8, 14, 28, 0.75)");
                ctx.fillRect(t.x, topY, t.w, t.h);

                ctx.strokeStyle = isGardenFinale
                    ? "rgba(80, 255, 160, 0.18)"
                    : (isLavaLevel ? "rgba(255, 70, 20, 0.15)" : "rgba(0, 255, 204, 0.12)");
                ctx.lineWidth = 1;
                ctx.strokeRect(t.x, topY, t.w, t.h);

                for (let row = topY + 15; row < canvas.height - 30; row += 22) {
                    const blink = Math.sin(time * 0.4 + i + row) > 0.2;
                    if (blink) {
                        ctx.fillStyle = isGardenFinale
                            ? "rgba(120, 255, 150, 0.35)"
                            : (isLavaLevel ? "rgba(255, 110, 30, 0.35)" : "rgba(0, 255, 204, 0.28)");
                        ctx.fillRect(t.x + 10, row, 6, 3);
                        ctx.fillRect(t.x + t.w - 16, row, 6, 3);
                    }
                }
            }

            // 3. Grade Cyberpunk ao fundo
            ctx.strokeStyle = isGardenFinale
                ? "rgba(100, 255, 180, 0.07)"
                : (isLavaLevel ? "rgba(255, 80, 20, 0.08)" : "rgba(0, 255, 204, 0.06)");
            ctx.lineWidth = 1;
            for (let i = 0; i < 800; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 400); ctx.stroke();
            }
            for (let j = 0; j < 400; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(800, j); ctx.stroke();
            }

            // 4. Partículas animadas (Vaga-lumes dourados no Jardim, Brasas na Lava, Dados nas fases iniciais)
            for (let p of bgParticles) {
                p.y -= isLavaLevel ? p.speed * 1.4 : p.speed * 0.6;
                p.x += Math.sin(time * 0.3 + p.y * 0.05) * 0.35;

                if (p.y < -10) {
                    p.y = canvas.height + 10;
                    p.x = Math.random() * canvas.width;
                }

                if (isGardenFinale) {
                    ctx.fillStyle = `rgba(255, 220, 90, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (isLavaLevel) {
                    ctx.fillStyle = `rgba(255, ${Math.floor(100 + p.alpha * 140)}, 20, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = `rgba(0, 255, 204, ${p.alpha * 0.7})`;
                    ctx.fillRect(p.x, p.y, p.size + 1, p.size + 1);
                }
            }

            // 5. Brilho inferior na Lava
            if (isLavaLevel) {
                const pulseGlow = 0.25 + Math.abs(Math.sin(time * 0.4)) * 0.15;
                const lavaGlow = ctx.createLinearGradient(0, 300, 0, 400);
                lavaGlow.addColorStop(0, "rgba(255, 60, 0, 0)");
                lavaGlow.addColorStop(1, `rgba(255, 80, 0, ${pulseGlow})`);
                ctx.fillStyle = lavaGlow;
                ctx.fillRect(0, 300, canvas.width, 100);
            }
        }

        function drawPlayer() {
            const cx = player.x + player.w / 2;
            const bottomY = player.y + player.h;
            const dir = player.facingRight ? 1 : -1;
            const isMoving = Math.abs(player.vx) > 0.1;
            const runCycle = isMoving ? time * 2.8 : 0;

            const bob = player.grounded
                ? (isMoving ? Math.abs(Math.sin(runCycle)) * 2 : Math.sin(time * 0.8) * 0.8)
                : 0;

            const torsoBottom = bottomY - 5 - bob;
            const torsoTop = torsoBottom - 10;
            const headBottom = torsoTop + 2;
            const headTop = headBottom - 15;

            // 1. Cachecol esvoaçante
            const scarfWave = Math.sin(time * 2.2) * 2.5;
            const scarfLen = isMoving ? 13 : 8;
            ctx.fillStyle = "#ff4d6d";
            ctx.beginPath();
            ctx.moveTo(cx - dir * 3, torsoTop + 2);
            ctx.quadraticCurve
